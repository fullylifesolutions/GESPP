<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consenso — Fullylife Solutions</title>
<style>
  :root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2733;--ink-soft:#5b6876;--line:#e2e6ea;--accent:#2f6f8f;--accent-ink:#1f4d63;--danger:#b3403a;--ok-bg:#e7f3ec;--ok-ink:#2f6b46;--font:'Iowan Old Style',Palatino,Georgia,serif;--ui:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding:18px;}
  .wrap{max-width:560px;margin:0 auto;}
  .brand{text-align:center;margin-bottom:18px;}
  .brand .mark{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:21px;}
  .brand p{margin:6px 0 0;font-size:13px;color:var(--ink-soft);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;}
  h1{font-family:var(--font);font-size:21px;margin:0 0 4px;}
  .sub{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
  .info-box{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px;line-height:1.55;max-height:280px;overflow-y:auto;margin-bottom:18px;white-space:pre-wrap;}
  .chk{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;font-size:14px;line-height:1.45;cursor:pointer;}
  .chk input{margin-top:3px;width:18px;height:18px;flex-shrink:0;}
  .firma-label{font-size:14px;font-weight:600;margin:18px 0 6px;}
  .firma-hint{font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
  canvas{width:100%;height:170px;border:2px dashed #c5ccd3;border-radius:8px;background:#fff;touch-action:none;display:block;}
  .firma-actions{margin-top:8px;}
  button{font-family:var(--ui);font-size:14px;border-radius:8px;cursor:pointer;}
  .btn-clear{padding:7px 13px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-main{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;font-weight:600;font-size:15px;margin-top:20px;}
  .btn-main:hover{background:var(--accent-ink);}
  .btn-main:disabled{opacity:.5;cursor:default;}
  .msg{font-size:14px;padding:11px 14px;border-radius:8px;margin-bottom:14px;display:none;}
  .msg.err{display:block;background:#f7e9e8;color:var(--danger);}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok-ink);}
  .center{text-align:center;}
  .loading{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px;}
  .done-ic{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok-ink);display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">◐</div><p>Fullylife Solutions</p></div>
  <div id="stage"><div class="card"><div class="loading">Caricamento…</div></div></div>
</div>

<script>
// === CONFIG: indirizzo del guardiano (Edge Function) ===
const FUNC_URL = "https://rronmtbpvhetoiddynmz.supabase.co/functions/v1/consenso";

const stage = document.getElementById('stage');
// legge token e canale dall'indirizzo: ...pagina.html?token=XXX&canale=presenza
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
const CANALE = params.get('canale') === 'presenza' ? 'presenza' : 'remoto';

let INFORMATIVA = null;

async function chiama(azione, extra){
  const res = await fetch(FUNC_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ azione, token: TOKEN, ...extra })
  });
  const data = await res.json().catch(()=>({errore:'Risposta non valida.'}));
  return { status: res.status, data };
}

async function init(){
  if(!TOKEN){ errore('Link non valido: manca il codice di accesso.'); return; }
  try{
    const { status, data } = await chiama('leggi', {});
    if(status !== 200){ errore(data.errore || 'Link non valido.'); return; }
    INFORMATIVA = data.informativa;
    mostraForm(data.persona, data.informativa);
  }catch(e){ errore('Impossibile contattare il servizio. Verifica la connessione e riprova.'); }
}

function errore(testo){
  stage.innerHTML = `<div class="card center">
    <h1>Non disponibile</h1>
    <p class="sub">${escapeHtml(testo)}</p>
    <p style="font-size:13px;color:var(--ink-soft);">Se pensi sia un errore, contatta il tuo consulente per un nuovo link.</p>
  </div>`;
}

function mostraForm(persona, info){
  const punti = info.punti.map((p,i)=>`
    <label class="chk"><input type="checkbox" class="punto" data-k="${p.chiave}"> <span>${escapeHtml(p.etichetta)}</span></label>`).join('');
  stage.innerHTML = `
    <div class="card">
      <h1>Consenso al trattamento</h1>
      <p class="sub">Documento per <strong>${escapeHtml(persona)}</strong></p>
      <div id="form-msg" class="msg"></div>
      <div class="info-box">${escapeHtml(info.testo)}</div>
      ${punti}
      <div class="firma-label">Firma</div>
      <p class="firma-hint">Firma nel riquadro qui sotto usando il dito o il mouse.</p>
      <canvas id="sig"></canvas>
      <div class="firma-actions"><button class="btn-clear" id="sig-clear">Cancella firma</button></div>
      <button class="btn-main" id="invia">Confermo e firmo</button>
    </div>`;
  setupCanvas();
  document.getElementById('invia').addEventListener('click', invia);
  document.getElementById('sig-clear').addEventListener('click', clearCanvas);
}

// ---- firma su canvas (mouse + touch) ----
let canvas, ctx, drawing=false, hasSignature=false;
function setupCanvas(){
  canvas = document.getElementById('sig');
  // dimensione reale del canvas = dimensione visuale (per nitidezza)
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d2733';
  const pos = (e)=>{ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const start=(e)=>{ drawing=true; hasSignature=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const move =(e)=>{ if(!drawing)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const end  =()=>{ drawing=false; };
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
}
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature=false; }

async function invia(){
  const msg = document.getElementById('form-msg'); msg.className='msg';
  // raccoglie spunte
  const spunte = {};
  document.querySelectorAll('.punto').forEach(c=>{ spunte[c.dataset.k]=c.checked; });
  const tutte = INFORMATIVA.punti.every(p=>spunte[p.chiave]===true);
  if(!tutte){ msg.textContent='Per procedere devi accettare tutti i punti.'; msg.className='msg err'; window.scrollTo(0,0); return; }
  if(!hasSignature){ msg.textContent='La firma è obbligatoria: firma nel riquadro.'; msg.className='msg err'; return; }

  const firma = canvas.toDataURL('image/png'); // firma come immagine
  const btn = document.getElementById('invia'); btn.disabled=true; btn.textContent='Invio…';
  try{
    const { status, data } = await chiama('firma', { spunte, firma, canale: CANALE });
    if(status!==200){ msg.textContent=data.errore||'Errore.'; msg.className='msg err'; btn.disabled=false; btn.textContent='Confermo e firmo'; return; }
    successo(data.persona);
  }catch(e){ msg.textContent='Errore di connessione. Riprova.'; msg.className='msg err'; btn.disabled=false; btn.textContent='Confermo e firmo'; }
}

function successo(persona){
  stage.innerHTML = `<div class="card center">
    <div class="done-ic">✓</div>
    <h1>Consenso registrato</h1>
    <p class="sub">Grazie. Il consenso${persona?(' di <strong>'+escapeHtml(persona)+'</strong>'):''} è stato registrato correttamente.</p>
    <p style="font-size:13px;color:var(--ink-soft);">Puoi chiudere questa pagina.</p>
  </div>`;
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

init();
</script>
</body>
</html>
